server {
    listen 80;
    listen [::]:80;
    server_name {{SERVER_NAME}};

    root {{FRONTEND_DIST}};
    index index.html;

    # API : proxy vers le backend Node, lié à 127.0.0.1 uniquement (jamais exposé directement).
    location /api/ {
        proxy_pass http://127.0.0.1:{{BACKEND_PORT}}/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA : toute route inconnue retombe sur index.html (react-router gère le routage côté client).
    location / {
        try_files $uri /index.html;
    }

    # Assets Vite hashés dans le nom de fichier : cache long sans risque de contenu périmé.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
